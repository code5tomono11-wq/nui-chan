<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ぬいぐるみチャンピオンズ</title>

<style>

body{
    background:#222;
    color:white;
    text-align:center;
    font-family:sans-serif;
}

h1{
    font-size:48px;
}

#bigCard{
    border:4px solid white;
    width:500px;
    margin:auto;
    padding:20px;
    background:#333;
}

#bigCard img{
    width:300px;
    height:300px;
    object-fit:contain;
    image-rendering:pixelated;
}

#characterList{
    display:grid;
    grid-template-columns:repeat(4,240px);
    gap:20px;
    justify-content:center;
    margin-top:30px;
}

.charButton img{
    width:100px;
    image-rendering:pixelated;
}

img[src$="mikan.png"]{
    width:64px !important;
    height:64px !important;
}

img[src$="mikan.png"]{
    width:40px !important;
    height:40px !important;
}

#bigImage[src$="mikan.png"]{
    width:80px !important;
    height:80px !important;
}

img[src="images/mikan.png"]{
    transform: scale(0.7);
}

#bigImage[src="images/mikan.png"]{
    transform: scale(0.7);
}

.charButton{
    background:#444;
    border:3px solid white;
    color:white;
    cursor:pointer;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;

    width:180px;
    height:120px;
}

.charButton:hover{
    background:#666;
}

#team{
    margin-top:30px;
    font-size:24px;
}

#zoneBackground{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background-size:cover;
    background-position:center;

    opacity:0.25;

    z-index:-1;

}

#battle{
    background-repeat:no-repeat;
    background-position:center;
    background-size:cover;
}

</style>

</head>
<body>

<div id="zoneBackground"></div>

<h1>ぬいぐるみチャンピオンズ</h1>

<div id="bigCard">

<img id="bigImage" src="images/pomu.png">

<h2 id="charName">ポム子</h2>

<p id="charInfo">
進化できるバランス型
</p>

</div>

<div id="characterList">

<div class="charButton" onclick="selectChar('chicken')">
<img src="images/chicken.png">
<br>
チキン
</div>

<div class="charButton" onclick="selectChar('kuu')">
<img src="images/kuu.png">
<br>
くうちゃん
</div>

<div class="charButton" onclick="selectChar('pomu')">
<img src="images/pomu.png">
<br>
ポム子
</div>

<div class="charButton" onclick="selectChar('suika')">
<img src="images/suika.png">
<br>
スイカゼリー
</div>

<div class="charButton" onclick="selectChar('mikan')">
<img src="images/mikan.png">
<br>
セクシーみかん
</div>

<div class="charButton" onclick="selectChar('buhuko')">
<img src="images/buhuko.png">
<br>
ブーフコ
</div>

<div class="charButton" onclick="selectChar('ringopan')">
<img src="images/ringopan.png">
<br>
リンゴパン
</div>

</div>

<h2>持ち物選択</h2>

<select id="itemSelect">

<option value="none">なし</option>

<option value="suikaRing">
スイカの皮のリング
</option>

<option value="kuuClaw">
くうちゃんの爪
</option>

<option value="pomuCotton">
ポム子の綿
</option>

<option value="applePiece">
リンゴパンのかけら
</option>

<option value="milkChocolate">
ミルクチョコレート
</option>

<option value="mikanPeel">
みかんの皮
</option>

</select>

<br>

<button onclick="addToTeam()">
チームに追加
</button>

<button onclick="showItemMenu()">
持ち物を選ぶ
</button>

<div id="itemMenu"></div>

<div id="team">

選択チーム

<ul id="teamList"></ul>

</div>
<br>

<hr>

<h2>通信対戦</h2>

<input id="playerNameInput"
placeholder="名前">

<br><br>

<button onclick="createRoom()">
部屋を作る
</button>

<button onclick="joinRoom()">
部屋に入る
</button>

<p id="roomInfo"></p>

<hr>

<h2>モード選択</h2>

<button onclick="startCpuMode()">
CPU対戦
</button>

<button onclick="startLocalMode()">
ローカル2人対戦
</button>

<button onclick="showOnlineMode()">
オンライン対戦
</button>

<p id="modeText">
CPU対戦モード
</p>

<p id="levelText">
レベル 1
</p>

<button onclick="startBattle()">
バトル開始
</button>

<br><br>

<div id="battle" style="display:none;">

<h3 id="enemyName"></h3>

<div style="width:300px;border:2px solid white;margin:auto">
<div id="enemyHpBar"
style="height:20px;background:red;width:100%">
</div>
</div>

<p id="enemyHp"></p>

<img id="enemyImg" width="180">

<hr>

<img id="playerImg" width="180">

<h3 id="playerName"></h3>

<div style="width:300px;border:2px solid white;margin:auto">
<div id="playerHpBar"
style="height:20px;background:lime;width:100%">
</div>
</div>

<p id="playerHp"></p>

<br>

<div id="moves">

<button onclick="useMove1()" id="move1">
技1
</button>

<button onclick="useMove2()" id="move2">
技2
</button>

<button onclick="useMove3()" id="move3">
技3
</button>

<button onclick="useMove4()" id="move4">
技4
</button>

</div>
<br><br>

<button onclick="showSwitchMenu()">
交代
</button>

<div id="switchMenu"></div>

<div id="log"
style="
width:500px;
height:150px;
overflow-y:auto;
border:2px solid white;
margin:auto;
padding:10px;
text-align:left;
background:#111;
">
</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();
</script>

<script>

let gameMode = "cpu";

let roomCode="";

const characters = {

chicken:{
name:"将来有望なケンタッキーのチキン",
type:"とり",
img:"images/chicken.png",
info:"コケコッコーで3ターン強化",
hp:95,
atk:22,
speed:18,
accuracy:100,
 ability:"砂漠育ち"
},

kuu:{
name:"くうちゃん",
type:"けもの",
img:"images/kuu.png",
info:"水陸両用",
ability:"水陸両用",
hp:90,
atk:30,
speed:15,
accuracy:100
},

pomu:{
name:"ポム子",
type:"まほう",
img:"images/pomu.png",
info:"へんしんぼうしで進化",
hp:100,
atk:18,
speed:22,
accuracy:100,
 ability:"ふわふわ"
},

suika:{
name:"スイカゼリー",
type:"みず",
img:"images/suika.png",
info:"殻の雨・殻盾を使う",
hp:120,
atk:15,
speed:10,
accuracy:100,
 ability:"水っぽい"
},

mikan:{
name:"セクシーみかん",
type:"フルーツ",
img:"images/mikan.png",
info:"セクシーダンス",
hp:95,
atk:20,
speed:30,
accuracy:100
}

,
buhuko:{
name:"ブーフコ",
type:"けもの",
img:"images/buhuko.png",
info:"ブッブーブー",
hp:150,
atk:20,
speed:8,
accuracy:100,
 ability:"里帰り"
},

pomu_hat:{
name:"ポム子（帽子あり）",
type:"まほう",
img:"images/pomu.png",
info:"進化後",
hp:130,
atk:28,
speed:25,
accuracy:100
},

ringopan:{
    name:"リンゴパン",
    type:"フルーツ",
    img:"images/ringopan.png",
    info:"毎ターン7回復するリンゴパン",
    ability:"つまみ食い",
    hp:105,
    atk:20,
    speed:18,
    accuracy:100
},

};

const items = {

none:{
    name:"なし"
},

suikaRing:{
    name:"スイカの皮のリング"
},

kuuClaw:{
    name:"くうちゃんの爪"
},

pomuCotton:{
    name:"ポム子の綿"
},

applePiece:{
    name:"リンゴパンのかけら"
},

milkChocolate:{
    name:"ミルクチョコレート"
},

mikanPeel:{
    name:"みかんの皮"
}

};

let current="pomu";

let team=[];
let teamItems=[];

function selectChar(id){

current=id;

document.getElementById("bigImage").src=
characters[id].img;

document.getElementById("charName").innerText=
characters[id].name;

document.getElementById("charInfo").innerText=
characters[id].info;
}

function addToTeam(){

if(team.length>=3){

alert("3体選んでいます");

return;
}

team.push({
    char:current,
    item:
    document.getElementById(
    "itemSelect"
    ).value
});

drawTeam();
}

function drawTeam(){

    let html="";

    team.forEach(c=>{

        html += `
<li>
${characters[c.char].name}
【${items[c.item].name}】
</li>
`;

    });

    document.getElementById("teamList").innerHTML = html;

}

let player;

let enemy;

let skipTurn=false;

let currentIndex=0;

let shieldTurns=0;

let enemyTeam=[];

let enemyIndex=0;

let teamData=[];

let poisonTurns=0;

let buffTurns=0;

let burnTurns=0;

let sleepTurns=0;

let enemyBuffTurns=0;

let playerPoisonTurns=0;

let level=1;

let firstBattle = true;

let enemyAtkDownTurns=0;

let currentItem = "none";

let appleArrowTurns=0;

let zone = "";
let zoneTurns = 0;

let tutorial = {
battle:false,
level:false,
evolve:false,
switch:false,
poison:false
};

let levels={
    chicken:1,
    kuu:1,
    pomu:1,
    suika:1,
    mikan:1,
    buhuko:1,
    ringopan:1
};

let exp={
    chicken:0,
    kuu:0,
    pomu:0,
    suika:0,
    mikan:0,
    buhuko:0,
    ringopan:0
};




function startBattle(){

    if(gameMode==="local"){

        alert("ローカル2人対戦モード");
        return;

    }

if(gameMode==="online"){

     console.log("オンライン開始");

    document.getElementById("battle").style.display="block";

    currentIndex=0;
    teamData=[];

team.forEach(c=>{

    let p =
    JSON.parse(
        JSON.stringify(
            characters[c.char]
        )
    );

    p.item = c.item;
    p.maxHp = p.hp;

    teamData.push(p);

});

player=teamData[0];    

if(player.name==="スイカゼリー"){

    zone="雨";
    zoneTurns=3;

    enemy.speed-=5;

    addLog("水っぽい！");
    addLog("雨が降り始めた！");

}

console.log("チーム送信",team);

socket.emit("selectTeam",{
    room:roomCode,
    team:team

});

    enemy={
        name:"対戦相手",
        hp:300,
        maxHp:300,
        img:"images/chicken.png"
    };

    drawBattle();
    return;
}

    if(team.length!==3){

        alert("3体選んでください");
        return;

    }

    document.getElementById("battle").style.display="block";

    currentIndex=0;
    teamData=[];

team.forEach(c=>{

    let p =
    JSON.parse(
        JSON.stringify(
            characters[c.char]
        )
    );

    let lv = levels[c.char];

    p.item = c.item;

    p.hp += (lv-1)*10;
    p.atk += (lv-1)*3;

    p.maxHp = p.hp;

    teamData.push(p);

});

player = teamData[0];

    enemyTeam=[
    "chicken",
    "kuu",
    "suika",
    "mikan",
    "buhuko"
    ];

    enemyIndex=0;

    enemy=
    JSON.parse(
    JSON.stringify(
    characters[
    enemyTeam[enemyIndex]
    ]
    ));

    enemy.maxHp=enemy.hp;

    drawBattle();

}
function addLog(text){

document.getElementById("log").innerHTML=
text+"<br>"+
document.getElementById("log").innerHTML;

}

function drawBattle(){

    if(player.hp < 0) player.hp = 0;

    if(enemy.hp < 0) enemy.hp = 0;

let playerDisplayName=player.name;

if(playerPoisonTurns>0){

playerDisplayName+=" ☠";

}

document.getElementById("playerName").innerText=
playerDisplayName;

if(poisonTurns>0){

let enemyDisplayName=enemy.name;

if(enemyBuffTurns>0){

enemyDisplayName+=" 🔥";

}

if(poisonTurns>0){

enemyDisplayName+=" ☠";

}

document.getElementById("enemyName").innerText=
enemyDisplayName;
}
else{

document.getElementById("enemyName").innerText=
enemy.name;

if(poisonTurns>0){

document.getElementById("enemyName").innerText=
enemy.name+" ☠";

document.getElementById("enemyName").style.color=
"violet";

}
else{

document.getElementById("enemyName").innerText=
enemy.name;

document.getElementById("enemyName").style.color=
"white";

}

document.getElementById("levelText").innerText=
"レベル "+levels[team[currentIndex].char];

}

document.getElementById("playerImg").src=
player.img;

document.getElementById("enemyImg").src=
enemy.img;

document.getElementById("playerHp").innerText=
player.hp+" / "+player.maxHp;

document.getElementById("enemyHp").innerText=
enemy.hp+" / "+enemy.maxHp;

document.getElementById("playerHpBar").style.width=
(player.hp/player.maxHp*100)+"%";

document.getElementById("enemyHpBar").style.width=
(enemy.hp/enemy.maxHp*100)+"%";

document.getElementById("enemyHpBar").style.width=
(enemy.hp/enemy.maxHp*100)+"%";

let playerPercent=
player.hp/player.maxHp*100;

if(playerPercent>50){

document.getElementById("playerHpBar").style.background=
"lime";

}
else if(playerPercent>20){

document.getElementById("playerHpBar").style.background=
"yellow";

}

else{

document.getElementById("playerHpBar").style.background=
"red";

}
updateMoves();

let bg = "images/grass.png";

if(zone==="雨"){
    bg="images/rain.png";
}

if(zone==="草原"){
    bg="images/grass.png";
}

if(zone==="浅い海"){
    bg="images/sea.png";
}

if(zone==="砂漠"){
    bg="images/desert.png";
}

document.getElementById("battle").style.backgroundImage =
`url(${bg})`;

document.getElementById("battle").style.backgroundSize =
"cover";

if(firstBattle){

alert(
"ぬいぐるみチャンピオンズへようこそ！\n\n"+
"技1: 通常攻撃\n"+
"技2: 強力攻撃\n"+
"技3: 必殺技\n"+
"技4: 防御\n\n"+
"敵を倒してレベルアップしよう！"
);

firstBattle = false;

}

if(!tutorial.battle){

addLog("=== チュートリアル ===");
addLog("技1: 通常攻撃");
addLog("技2: 強力攻撃");
addLog("技3: 必殺技");
addLog("技4: 防御");
addLog("交代ボタンで仲間を交代できる");
addLog("敵を倒してレベルアップしよう！");

tutorial.battle=true;
}

if(zone==="雨"){

    document.getElementById(
    "zoneBackground"
    ).style.backgroundImage=
    "url('images/rain.png')";

}

else if(zone==="草原"){

    document.getElementById(
    "zoneBackground"
    ).style.backgroundImage=
    "url('images/grassland.png')";

}

else{

    document.getElementById(
    "zoneBackground"
    ).style.backgroundImage=
    "";

}

}


function attack(){

if(skipTurn){

skipTurn=false;

addLog("くうちゃんは休んでいる！");

if(gameMode!=="online"){
    enemyTurn();
}

return;
}

enemy.hp -= player.atk;

if(enemy.hp<0)
enemy.hp=0;

addLog(player.name+"の攻撃！");drawBattle();

if(enemy.hp<=0){

    socket.emit("win",roomCode);

    alert("勝ち！");

nextEnemy();

return;

}

if(gameMode!=="online"){
    enemyTurn();
}

}

function nextEnemy(){

let currentChar = team[currentIndex].char;

while(exp[currentChar]>=levels[currentChar]*10){

    exp[currentChar]-=levels[currentChar]*10;
    levels[currentChar]++;

    saveGame();

    player.maxHp+=10;
    player.hp+=10;
    player.atk+=3;

    addLog(
        characters[currentChar].name+
        "はレベル"+
        levels[currentChar]+
        "になった！"
    );
}

exp[currentChar]+=10;

addLog("経験値+10！");

enemyIndex++;

if(enemyIndex>=enemyTeam.length){

    alert("勝利！！");

   saveGame();

    return;

}

if(!tutorial.level){

addLog("=== レベルアップ ===");
addLog("HPと攻撃力が上がる！");
tutorial.level=true;

}

enemy=
JSON.parse(
JSON.stringify(
characters[
enemyTeam[enemyIndex]
]
));

enemy.maxHp=enemy.hp;

addLog(enemy.name+"登場！");

drawBattle();

}

function specialMove(){

    if(player.name==="リンゴパン"){

        enemy.hp -= 40;
        appleArrowTurns = 3;

        addLog("アポーアロー！");
        addLog("40ダメージ！");
    }

else if(player.name==="くうちゃん"){

    enemy.hp -= 70;

    if(enemy.hp < 0){
        enemy.hp = 0;
    }

    socket.emit("move",{
        room:roomCode,
        damage:70
    });

    skipTurn = true;

    addLog("おもりキック！次のターン休み！");

    drawBattle();

    if(enemy.hp <= 0){
        nextEnemy();
        return;
    }

    if(gameMode!=="online"){
        enemyTurn();
    }

    return;
}
    else if(player.name==="将来有望なケンタッキーのチキン"){

        buffTurns = 3;

        addLog("コケコッコー！");
        addLog("3ターン攻撃力アップ！");
    }

    else if(player.name==="スイカゼリー"){

        player.hp += 30;

        if(player.hp>player.maxHp){
            player.hp=player.maxHp;
        }

        enemy.hp -= 20;

        poisonTurns = 3;

        addLog("殻の雨！");
        addLog("相手は毒になった！");
    }

    else if(player.name==="セクシーみかん"){

        enemy.accuracy -= 20;

        if(enemy.accuracy<50){
            enemy.accuracy=50;
        }

        enemy.speed -= 10;

        if(enemy.speed<1){
            enemy.speed=1;
        }

        addLog("セクシーダンス！");
    }

    else if(player.name==="ブーフコ"){

        enemyAtkDownTurns=3;

        zone="草原";
        zoneTurns=3;

        addLog("草原になった！");
    }

    else if(player.name==="ポム子"){

        let oldHp=player.hp;

        player.name="ポム子（帽子あり）";
        player.maxHp=130;
        player.hp=Math.min(oldHp+30,130);
        player.atk=28;
        player.speed=25;

        addLog("ポム子は進化した！");
    }

    else if(player.name==="ポム子（帽子あり）"){

        let damage=80;

        if(Math.random()<0.25){

            damage*=2;
            addLog("クリティカル！");
        }

        enemy.hp-=damage;

        if(Math.random()<0.3){

            burnTurns=3;
            addLog("やけど！");
        }

        addLog("ぼうしミサイル！");
    }

    if(enemy.hp<0){
        enemy.hp=0;
    }

    drawBattle();

    if(enemy.hp<=0){
        nextEnemy();
        return;
    }

    if(gameMode!=="online"){
        enemyTurn();
    }
}
function quickAttack(){
enemy.hp-=10;

addLog("はやうち！");

drawBattle();

if(gameMode!=="online"){
    enemyTurn();
}
}

function healMove(){

player.hp+=20;

if(player.hp>player.maxHp)
player.hp=player.maxHp;

addLog(
"回復した！");

drawBattle();

if(gameMode!=="online"){
    enemyTurn();
}
}
function enemyTurn(){

if(appleArrowTurns>0){

    enemy.hp-=8;

    appleArrowTurns--;

    addLog("アポーアローの追加ダメージ！");

}

if(player.ability==="つまみ食い"){

    player.hp+=7;

    if(player.hp>player.maxHp){
        player.hp=player.maxHp;
    }

    addLog("つまみ食いで7回復！");
}

if(zone==="浅い海"){

    player.hp-=5;

    addLog("窒息ダメージ 5!");

}

if(zone==="草原"){

    player.hp-=3;

    addLog("虫に食われた！ 3ダメージ");

}

if(zone==="砂漠"){

    player.hp-=10;

    addLog("砂嵐ダメージ 10!");

}

     if(gameMode==="online"){
        return;
    }

if(enemy.speed > player.speed){

    if(Math.random() < 0.3){

        addLog("敵が素早く先制した！");

        let damage = enemy.atk;

        player.hp -= damage;

        if(player.hp < 0){
            player.hp = 0;
        }

        drawBattle();

        if(player.hp <= 0){

            showReviveMenu();
            return;
        }
    }
}

if(player.hp <= 0){

    let alive = false;

    for(let i=0;i<teamData.length;i++){

        if(teamData[i].hp > 0){
            alive = true;
        }

    }

    if(alive){

        showReviveMenu();
    }
    else{

        alert("敗北...");
    }

    return;
}

if(sleepTurns>0){

sleepTurns--;

addLog("敵は眠っている！");

return;

}

if(burnTurns>0){

enemy.hp-=8;

if(enemy.hp<0){
    enemy.hp=0;
}

burnTurns--;

addLog("やけどダメージ！");

if(enemy.hp<=0){

nextEnemy();

return;

}

}

if(zoneTurns>0){

    zoneTurns--;

    if(zoneTurns<=0){

addLog("自分は毒ダメージを受けた！");

let alive=0;

for(let i=0;i<teamData.length;i++){

if(teamData[i].hp>0){

}

}

}

}

let damage=enemy.atk;

if(player.item==="suikaRing"){

    damage=Math.floor(damage/1.2);

}

if(player.item==="pomuCotton"){
    damage=Math.floor(damage/1.5);
}

if(player.item){

    let item=items[player.item];

    if(item.def){

        damage=
        Math.floor(
        damage/item.def
        );

    }
}

if(
player.name==="ポム子" &&
Math.random()<0.2
){

    damage=
    Math.floor(damage*0.75);

    addLog("ふわふわ発動！");

}

if(Math.random()*100 > enemy.accuracy){

addLog(enemy.name+"の攻撃は外れた！");
return;

}

if(enemyAtkDownTurns > 0){

damage = Math.floor(damage * 0.8);

enemyAtkDownTurns--;

}

if(enemyBuffTurns>0){

damage*=2;

enemyBuffTurns--;

}

let move=Math.floor(Math.random()*5);

if(poisonTurns>0){

enemy.hp-=5;

if(enemy.hp<0){
    enemy.hp=0;
}

poisonTurns--;

addLog("毒ダメージ！");

drawBattle();

if(enemy.hp<=0){

nextEnemy();

return;

}

}

if(enemy.name==="将来有望なケンタッキーのチキン" && move===0){

enemyBuffTurns=3;

addLog(
"敵チキンのコケコッコー！");

drawBattle();

return;

}
if(enemy.name==="くうちゃん" && move===0){

player.hp-=70;

if(player.hp<0)
player.hp=0;

addLog(
"敵くうちゃんのおもりキック！");

drawBattle();

return;

}

if(enemy.name==="スイカゼリー" && move===0){

shieldTurns=2;

addLog(
"敵スイカの殻盾！");

drawBattle();

return;

}

if(enemy.name==="スイカゼリー" && move===1){

playerPoisonTurns=3;

if(!tutorial.poison){

addLog("=== 状態異常 ===");
addLog("毒になると毎ターンダメージ！");
tutorial.poison=true;

}

addLog(
"敵スイカの殻の雨！");

drawBattle();

return;

}


if(shieldTurns>0){

damage=Math.floor(damage/2);

shieldTurns--;

}

if(
player.item==="applePiece" &&
!player.itemUsed &&
damage>=player.hp
){

    player.hp=1;

    player.itemUsed=true;

    addLog(
    "リンゴパンのかけらで耐えた！"
    );

    drawBattle();

    return;
}

if(
player.item==="applePiece" &&
player.hp===player.maxHp &&
damage>=player.hp
){

    player.hp=1;
    player.item="none";

    addLog("リンゴパンのかけらで耐えた！");

    drawBattle();

    return;
}

player.hp-=damage;

if(player.hp<0)
player.hp=0;

addLog(
enemy.name+"の攻撃！");

drawBattle();

if(player.hp<=0){

    let alive = 0;

    for(let i=0;i<teamData.length;i++){

        if(teamData[i].hp>0){
            alive++;
        }

    }

    if(alive<=0){

        alert("敗北...");
        return;

    }

    showReviveMenu();
    return;

}

}

function getTypeBonus(attacker, defender){

if(attacker.type==="とり" && defender.type==="けもの")
return 1.5;

if(attacker.type==="けもの" && defender.type==="まほう")
return 1.5;

if(attacker.type==="まほう" && defender.type==="みず")
return 1.5;

if(attacker.type==="みず" && defender.type==="とり")
return 1.5;

if(defender.type==="とり" && attacker.type==="けもの")
return 0.7;

if(defender.type==="けもの" && attacker.type==="まほう")
return 0.7;

if(defender.type==="まほう" && attacker.type==="みず")
return 0.7;

if(defender.type==="みず" && attacker.type==="とり")
return 0.7;

return 1;

}

function showSwitchMenu(){

let html="<h3>交代するキャラを選んでください</h3>";

for(let i=0;i<teamData.length;i++){

if(teamData[i].hp<=0) continue;

html+=`
<button onclick="switchTo(${i})">
${teamData[i].name}
HP:${teamData[i].hp}
</button><br><br>
`;

}

document.getElementById("switchMenu").innerHTML=html;

}

function switchTo(index){

currentIndex=index;

player=teamData[currentIndex];

if(player.name==="スイカゼリー"){

    zone="雨";
    zoneTurns=3;

    enemy.speed-=5;

    addLog("水っぽい！");
    addLog("雨が降り始めた！");

}

drawBattle();

addLog(player.name+"に交代した！");

if(!tutorial.switch){

addLog("=== 交代説明 ===");
addLog("危なくなったら交代しよう！");
tutorial.switch=true;

}

document.getElementById("switchMenu").innerHTML="";

if(gameMode!=="online"){
    enemyTurn();
}

}

function showReviveMenu(){

let html="<h3>次に出すキャラを選んでください</h3>";

for(let i=0;i<teamData.length;i++){

if(i===currentIndex) continue;

if(teamData[i].hp<=0) continue;

html+=`
<button onclick="reviveTo(${i})">
${teamData[i].name}
HP:${teamData[i].hp}
</button><br><br>
`;

}

document.getElementById("switchMenu").innerHTML=html;

}

function showItemMenu(){

let html="<h3>持ち物を選択</h3>";

for(let i=0;i<team.length;i++){

html+="<b>"+characters[team[i].char].name+"</b><br>";

for(let key in items){

html+=`
<button onclick="setItem(${i},'${key}')">
${items[key].name}
</button>
`;

}

html+="<br><br>";

}

document.getElementById("itemMenu").innerHTML=html;

}

);

}

function reviveTo(index){

    currentIndex=index;

    player=teamData[currentIndex];

    drawBattle();

    addLog(player.name+"登場！");

    document.getElementById("switchMenu").innerHTML="";

}

function createRoom(){

    roomCode =
    Math.floor(
    1000 + Math.random()*9000
    ).toString();

    socket.emit("createRoom",roomCode);

    document.getElementById("roomInfo").innerText =
    "部屋番号 : " + roomCode;

}

function joinRoom(){

    let code =
    prompt("部屋番号を入力");

    if(!code) return;

    roomCode = code;

    socket.emit("joinRoom",roomCode);

    document.getElementById("roomInfo").innerText =
    "参加中 : " + roomCode;

}

function startCpuMode(){

    gameMode = "cpu";

    document.getElementById("modeText").innerText =
    "CPU対戦モード";

}

function startLocalMode(){

    gameMode = "local";

    document.getElementById("modeText").innerText =
    "ローカル2人対戦モード";

}

function showOnlineMode(){

    gameMode = "online";

    document.getElementById("modeText").innerText =
    "オンライン対戦モード";

}

socket.on("battleStart",()=>{

    alert("対戦相手が接続しました");

    socket.emit("teamData",{
        room:roomCode,
        team:team
    });

    startBattle();

});

socket.on("enemyMove",(data)=>{

    player.hp -= data.damage;

    if(player.hp < 0){
        player.hp = 0;
    }

    addLog("相手の攻撃！");
    addLog(data.damage + "ダメージ");

    drawBattle();

    if(player.hp <= 0){

        alert("負け！");

    }

});

socket.on("enemyTeam",(enemyTeamData)=>{

    console.log("enemyTeam受信", enemyTeamData);

    enemy =
    JSON.parse(
        JSON.stringify(
            characters[
                enemyTeamData[0]
            ]
        )
    );

    enemy.maxHp = enemy.hp;

    drawBattle();

});

socket.on("lose",()=>{

    alert("負け！");

});

function saveGame(){	

    localStorage.setItem(
        "nui_levels",
        JSON.stringify(levels)
    );
	
    localStorage.setItem(
        "nui_exp",
        JSON.stringify(exp)
    );

}

let savedLevels =
localStorage.getItem("nui_levels");

if(savedLevels){
    levels = JSON.parse(savedLevels);
}

let savedExp =
localStorage.getItem("nui_exp");

if(savedExp){
    exp = JSON.parse(savedExp);
}

function selectItem(id){
    currentItem=id;
}
